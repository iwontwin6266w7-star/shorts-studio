<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;padding:0;background:#111;}canvas{display:block;}</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script>
const INK = "#241726";
const SKIN = "#ffe2c2";
const MOUTH = "#5a1e28";
const WHITE = "#ffffff";
const SH_SKIN = [0.96, 0.86, 0.84];
const rad = (d) => (d * Math.PI) / 180;

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const CW = cv.width, CH = cv.height;

const mul = (c, m) => {
  const n = parseInt(c.slice(1), 16);
  const ch = (v, k) => Math.min(255, Math.round(v * k)).toString(16).padStart(2, "0");
  return `#${ch((n >> 16) & 255, m[0])}${ch((n >> 8) & 255, m[1])}${ch(n & 255, m[2])}`;
};
const rnd = (seed, k) => {
  const x = Math.sin(seed * 127.1 + k * 311.7) * 43758.5453;
  return x - Math.floor(x);
};

function blobPts(cx, cy, B, n = 96) {
  const ph = [rnd(B.seed, 11), rnd(B.seed, 12), rnd(B.seed, 13)].map((v) => v * Math.PI * 2);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
    const e = 2 / (s < 0 ? B.nTop : B.nBot);
    let X = Math.sign(c) * Math.abs(c) ** e;
    const Y = Math.sign(s) * Math.abs(s) ** e;
    X *= (1 + B.egg * Y) * (1 + B.asym * Math.sign(X));
    const r = 1 + B.noise * (Math.cos(2 * t + ph[0]) + 0.7 * Math.cos(3 * t + ph[1]) + 0.5 * Math.cos(4 * t + ph[2]));
    const x = B.a * X * r, y = B.b * Y * r;
    pts.push([cx + x * Math.cos(B.rot) - y * Math.sin(B.rot), cy + x * Math.sin(B.rot) + y * Math.cos(B.rot)]);
  }
  return pts;
}

function headBlob(seed, a = 350, facing = 0) {
  return {
    a,
    b: a * (0.94 + 0.08 * (rnd(seed, 1) - 0.5)),
    nTop: 1.75 + 0.3 * (rnd(seed, 2) - 0.5),
    nBot: 2.3 + 0.3 * (rnd(seed, 3) - 0.5),
    egg: -0.12 + 0.06 * (rnd(seed, 4) - 0.5),
    asym: (0.06 + 0.04 * rnd(seed, 5)) * (facing || (rnd(seed, 6) < 0.5 ? -1 : 1)),
    rot: rad(8 * (rnd(seed, 7) - 0.5)),
    noise: 0.008,
    seed,
  };
}

const thickAngle = (light) => Math.atan2(-Math.sin(light) + 0.8, -Math.cos(light));

function trace(pts) {
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
}

function shadedFill(pts, base, shadow, light, R, shift = 0.3, soft = 0.09) {
  ctx.save();
  ctx.beginPath(); trace(pts); ctx.clip();
  ctx.fillStyle = shadow; ctx.fillRect(0, 0, CW, CH);
  const dx = Math.cos(light) * shift * R, dy = Math.sin(light) * shift * R;
  ctx.filter = `blur(${(soft * R).toFixed(1)}px)`;
  ctx.beginPath(); trace(pts.map(([x, y]) => [x + dx, y + dy]));
  ctx.fillStyle = base; ctx.fill();
  ctx.filter = "none";
  ctx.restore();
}

function inkRing(pts, w0, thick, k = 0.45, col = INK) {
  const n = pts.length;
  let cx = 0, cy = 0;
  for (const [x, y] of pts) { cx += x / n; cy += y / n; }
  const out = [], inn = [];
  pts.forEach((q, i) => {
    const a = pts[(i + n - 1) % n], b = pts[(i + 1) % n];
    let nx = b[1] - a[1], ny = a[0] - b[0];
    const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    const h = 0.5 * w0 * (1 + k * Math.cos(Math.atan2(q[1] - cy, q[0] - cx) - thick));
    out.push([q[0] + nx * h, q[1] + ny * h]);
    inn.push([q[0] - nx * h, q[1] - ny * h]);
  });
  ctx.beginPath();
  trace(out);
  trace(inn.reverse());
  ctx.fillStyle = col;
  ctx.fill("evenodd");
}

function dot(x, y, r, col = INK) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
}

function taper(a, b, wa, wb, col = INK) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
  const nx = -dy / l, ny = dx / l;
  ctx.beginPath();
  trace([
    [a[0] + nx * wa / 2, a[1] + ny * wa / 2],
    [b[0] + nx * wb / 2, b[1] + ny * wb / 2],
    [b[0] - nx * wb / 2, b[1] - ny * wb / 2],
    [a[0] - nx * wa / 2, a[1] - ny * wa / 2],
  ]);
  ctx.fillStyle = col; ctx.fill();
  dot(a[0], a[1], wa / 2, col);
  dot(b[0], b[1], wb / 2, col);
}

function drawLidEye(x, ey, u) {
  ctx.beginPath(); ctx.ellipse(x, ey - u, 7 * u, 6 * u, 0, 0, Math.PI);
  ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 9 * u, ey - u); ctx.lineTo(x + 9 * u, ey - u);
  ctx.lineWidth = 3.8 * u; ctx.lineCap = "round"; ctx.strokeStyle = INK; ctx.stroke();
}

function drawFace(cx, cy, W, light) {
  const u = W / 100;
  const facing = 0, look = 0;
  const fx = cx + 7 * u * facing;
  const ex = 13 * u, ey = cy;
  for (const side of [-1, 1]) {
    const x = fx + side * ex;
    drawLidEye(x, ey, u);
    const dI = 0, dO = -1, by = ey - 20 * u;
    taper([x - side * 8.5 * u, by + dI * u], [x + side * 8.5 * u, by + dO * u], 5 * u, 2.5 * u);
  }
  const mx = cx + 8 * u * facing, my = cy + 20 * u;
  ctx.beginPath();
  ctx.moveTo(mx - 5.5 * u, my);
  ctx.lineTo(mx + 5.5 * u, my - 0.8 * u);
  ctx.lineWidth = 4 * u; ctx.lineCap = "round"; ctx.strokeStyle = INK; ctx.stroke();
}

function render() {
  // backdrop
  const bg = ctx.createLinearGradient(0, 0, CW, CH);
  bg.addColorStop(0, "#3b4455");
  bg.addColorStop(0.55, "#272d3a");
  bg.addColorStop(1, "#15181f");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, CW, CH);
  const glow = ctx.createRadialGradient(CW * 0.34, CH * 0.26, 40, CW * 0.34, CH * 0.26, CH * 0.75);
  glow.addColorStop(0, "rgba(255,224,190,0.16)");
  glow.addColorStop(1, "rgba(255,224,190,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, CW, CH);

  const seed = 7, facing = 0, light = rad(-120);
  const W = 700, a = W / 2, cx = CW / 2, cy = CH / 2;
  const H = headBlob(seed, a, facing);
  const u = W / 100;
  const ow = 5 * u;
  const thick = thickAngle(light);
  const hp = blobPts(cx, cy, H);

  // soft cast shadow for depth
  ctx.save();
  ctx.filter = `blur(${(0.12 * a).toFixed(0)}px)`;
  ctx.fillStyle = "rgba(8,10,14,0.55)";
  ctx.beginPath();
  ctx.ellipse(cx + 0.13 * a, cy + 1.02 * H.b, 0.66 * a, 0.12 * a, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // head: shaded fill + thick/thin plum ink ring
  shadedFill(hp, SKIN, mul(SKIN, SH_SKIN), light, H.a);
  inkRing(hp, ow, thick);

  // face
  drawFace(cx, cy, W, light);
}

render();
</script>
</body>
</html>
