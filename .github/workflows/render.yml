name: Render NightMarketShort

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg and Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Install dependencies
        run: npm ci || npm install
        working-directory: app

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render NightMarketShort out/nightmarket.mp4 --gl=swangle --timeout=600000 --concurrency=2 --chrome-flag="--no-sandbox" --log=error
        working-directory: app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightmarket-video
          path: app/out/nightmarket.mp4
