# Why Guy-Style Listicle Short Renderer
# Format: "10 Weird Things About [NAME]..."
# Style: Documentary slideshow with Ken Burns effect, archival photos
name: Render Why Guy Short

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      subject:
        description: 'Subject name (e.g., LeBron_James, Einstein, Tesla)'
        required: true
        default: 'LeBron_James'
      scale:
        description: 'Render scale (1.0 for 1080p, 1.3333 for 2K)'
        required: true
        default: '1.0'

concurrency:
  group: render-${{ github.event.inputs.subject || 'whyguy' }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg and Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Install dependencies
        run: npm ci || npm install
        working-directory: app

      - name: Render video (1080x1920 vertical @ 30fps, ~60s)
        run: |
          mkdir -p out
          npx remotion render WhyGuyShort out/video.mp4 \
            --gl=swangle \
            --timeout=600000 \
            --concurrency=2 \
            --scale=${{ github.event.inputs.scale || '1.0' }} \
            --codec=h264 \
            --crf=16 \
            --chrome-flag="--no-sandbox" \
            --log=error
        working-directory: app

      - name: Verify output specs
        run: |
          echo "=== Output Verification ==="
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of csv=p=0 out/video.mp4
          echo "=== Loudness check (target: -14 LUFS) ==="
          ffmpeg -i out/video.mp4 -af ebur128=peak=true -f null - 2>&1 | grep -E "I:|LRA:|Peak:"
        working-directory: app
        continue-on-error: true

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: whyguy-${{ github.event.inputs.subject || 'lebron' }}-video
          path: app/out/video.mp4
          if-no-files-found: error

      - name: Create release notes
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "## Why Guy Short Render Complete" > release_notes.md
          echo "- Subject: ${{ github.event.inputs.subject || 'LeBron_James' }}" >> release_notes.md
          echo "- Scale: ${{ github.event.inputs.scale || '1.0' }}" >> release_notes.md
          echo "- Resolution: $(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 out/video.mp4)" >> release_notes.md
          echo "- Duration: ~60 seconds" >> release_notes.md
          echo "- Style: Archival photos + Ken Burns + narration" >> release_notes.md
          cat release_notes.md
        working-directory: app